<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function () {
  try { if (window.hljs) document.querySelectorAll('pre code[class^="language-"]').forEach(function (el) { window.hljs.highlightElement(el); }); } catch (e) {}
  document.querySelectorAll('.copy').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var box = btn.closest('.code');
      var code = box && box.querySelector('pre code');
      if (!code) return;
      var text = code.innerText;
      var done = function () { btn.textContent = 'Copiado'; setTimeout(function () { btn.textContent = 'Copiar'; }, 1600); };
      var fallback = function () {
        var r = document.createRange(); r.selectNodeContents(code);
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        btn.textContent = 'Selecionado';
        setTimeout(function () { btn.textContent = 'Copiar'; }, 1600);
      };
      try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
    });
  });
})();
</script>
