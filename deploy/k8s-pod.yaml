# Pod que builda, escaneia e publica no ECR central, num nó de UMA arquitetura.
# Para multi-arch no EKS: um pod destes por arquitetura (troque nodeSelector e o
# sufixo da tag) e depois um "forja manifest" juntando as duas
# (Manual da Forja: "Multi-arquitetura e nós mistos no EKS").
# Permissões: Manual da Forja, "Permissões mínimas". hostUsers exige K8s 1.33+.
#
# Credencial do ECR: EKS Pod Identity. Associe a ServiceAccount "forja" a uma
# role da conta central com ecr:GetAuthorizationToken e push no repositório.
# O agente da Pod Identity injeta AWS_CONTAINER_CREDENTIALS_FULL_URI no pod, e o
# SDK da AWS dentro do forja usa isso sozinho: nenhum secret no pod.
apiVersion: v1
kind: Pod
metadata:
  name: forja-build-arm64
spec:
  serviceAccountName: forja   # associada à role do ECR via Pod Identity
  hostUsers: false            # user namespace: root no container, usuário comum no nó
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/arch: arm64
  initContainers:
    - name: clone             # traz o código (com o Dockerfile) para /workspace
      image: docker.io/alpine/git:latest
      args: ["clone", "--depth", "1", "https://github.com/chwiee/app.git", "/workspace"]
      volumeMounts: [{ name: workspace, mountPath: /workspace }]
  containers:
    - name: forja
      image: ghcr.io/chwiee/forja:0.4.1   # multi-arch: o nó puxa a variante dele
      args: ["run", "--registry", "ecr", "--name", "org/app", "--tag", "v1.0.0-arm64", "--immutable", "/workspace"]
      env:
        - { name: STORAGE_DRIVER, value: overlay }
        - { name: FORJA_ECR_ACCOUNT, value: "123456789012" }   # conta central (troque pela real)
      securityContext:
        runAsUser: 0
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
          add: ["SYS_ADMIN", "CHOWN", "DAC_OVERRIDE", "FOWNER", "FSETID", "KILL",
                "NET_BIND_SERVICE", "SETFCAP", "SETGID", "SETPCAP", "SETUID", "SYS_CHROOT"]
        seccompProfile: { type: RuntimeDefault }
        appArmorProfile: { type: Unconfined }   # o perfil padrão bloqueia mount
      volumeMounts:
        - { name: workspace, mountPath: /workspace }
        - { name: tmp,       mountPath: /var/tmp }
        - { name: storage,   mountPath: /var/lib/containers }
        - { name: run,       mountPath: /run }
        - { name: cache,     mountPath: /var/cache/containers }
  volumes:
    - { name: workspace, emptyDir: {} }
    - { name: tmp,       emptyDir: {} }
    - { name: storage,   emptyDir: {} }
    - { name: run,       emptyDir: { medium: Memory } }
    - { name: cache,     emptyDir: {} }
